[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-bot"
version = "0.1.0"
description = "Policy-first Polymarket trading assistant scaffold"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "OpenAI Codex" }]
dependencies = ["PyYAML>=6.0", "httpx>=0.28", "websockets>=15.0"]

[project.scripts]
bot = "bot.cli.app:main"

[tool.setuptools.packages.find]
include = ["bot*"]
